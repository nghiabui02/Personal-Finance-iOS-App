name: iOS

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint if the image lacks it
        run: command -v swiftlint || brew install swiftlint
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The real file is git-ignored; placeholder values are enough to compile and run unit tests.
      - name: Provide placeholder secrets
        run: cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig
      - name: Pick a simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, items in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in items if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project "My Finance.xcodeproj" \
            -scheme "Personal Finance" \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
